<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saree Try-On Bridge</title>
<link rel="stylesheet" href="panel.css">
</head>
<!--
  The shopkeeper's side of it, and only that: what is on the shelf, and the
  wording each kind of garment is sent with.
  There is no photograph here and no send button. Customers are photographed at
  the kiosk and the extension's own worker does the sending, so a second way to
  do both sat here unused, taking the top of the panel and leaving the shelf -
  which is the whole job - below the fold.
-->
<body>

<header>
  <h1>Saree Try-On</h1>
  <p class="sub" id="status">Anything added here appears on every screen.</p>
</header>

<section>
  <h2>1 &middot; The shelf</h2>
  <div id="garments" class="grid"></div>
  <div class="row">
    <select id="addkind" title="Which instruction to send with a new garment"></select>
    <label class="file">Add garment<input type="file" id="addgarment" accept="image/*" hidden></label>
  </div>
  <div class="row hidden" id="selectedrow">
    <select id="garmentkind" title="What this garment is"></select>
    <button id="removegarment" class="ghost">Remove</button>
  </div>
</section>

<section>
  <h2>2 &middot; What it is sent with <span id="promptkind" class="tag"></span></h2>
  <textarea id="prompt" rows="14" spellcheck="false"></textarea>
  <div class="row">
    <button id="resetprompt" class="ghost">Reset to default</button>
  </div>
</section>

<footer>
  <p>Each kind of garment keeps its own wording. Changes are saved as you type
     and are used by every screen on the next try-on.</p>
</footer>

<script type="module" src="panel.js"></script>
</body>
</html>
