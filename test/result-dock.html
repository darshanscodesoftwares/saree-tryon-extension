<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dock-start</title>
<!--
  The result screen: three controls in the dock, and Save laid on the
  photograph itself.

  Two things here break silently and look fine in a screenshot taken at one
  width. The dock's own stylesheet says its controls fit only if none of them
  wraps. And Save is pinned to a wrapper that shrink-wraps the picture, because
  .shot img is width:auto - the figure is usually WIDER than the image inside
  it, so anything pinned to the figure floats off the edge of the photograph
  the moment the height cap bites. Neither is visible without measuring.

  It drives the real kiosk page in an iframe at real widths, puts it in the
  result stage with a real 2:3 picture, and measures what is on screen.

  Also checks what icon-only buttons depend on: that each one still has a name
  a screen reader can read, since the shape is the only label a customer gets.

  Same origin, so the iframe's DOM can be read. Needs `npm start`.
  Run in REAL time: it waits on layout and images, which are not timers.
-->
</head>
<body>
<iframe id="kiosk" src="about:blank" style="border:1px solid #333"></iframe>
<pre id="log" style="font:12px/1.6 ui-monospace,Menlo,monospace"></pre>
<script type="module">
const checks = [];
const ok = (n, p) => checks.push([n, p]);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const api = (p) => new URL(p, location.href).href;

const frame = document.getElementById("kiosk");

// A 2:3 picture, the shape these generators return, big enough that the
// height cap bites and the image ends up narrower than its column.
const PICTURE = (() => {
  const c = document.createElement("canvas");
  c.width = 1024; c.height = 1536;
  const x = c.getContext("2d");
  x.fillStyle = "#cfd3d8"; x.fillRect(0, 0, 1024, 1536);
  x.fillStyle = "#3a3f46"; x.fillRect(300, 400, 420, 900);
  return c.toDataURL("image/png");
})();

// A phone, a small phone, and a desktop. Below 460 the labels shorten, and
// 360 is about as narrow as a phone in use gets.
const WIDTHS = [[360, "a small phone"], [390, "a phone"], [1200, "a desktop"]];

async function openAt(width, kiosk) {
  frame.style.width = `${width}px`;
  frame.style.height = "780px";
  await new Promise((done) => {
    frame.onload = done;
    frame.src = api("../webapp/") + "?w=" + width + (kiosk ? "&kiosk=1" : "");
  });
  const d = frame.contentDocument;
  // Wait for boot(), not for the markup: the buttons are in the static HTML,
  // so their presence says nothing about whether the page has started.
  for (let i = 0; i < 100; i++) {
    if (d.body.dataset.stage) break;
    await sleep(50);
  }
  const img = d.getElementById("result");
  img.src = PICTURE;
  await img.decode().catch(() => {});
  d.body.dataset.stage = "result";
  await new Promise((r) => frame.contentWindow.requestAnimationFrame(
    () => frame.contentWindow.requestAnimationFrame(r)));
  return d;
}

const lines = [];

for (const [w, what] of WIDTHS) {
  const d = await openAt(w, false);
  const row = d.getElementById("resultacts");
  const btns = [...row.querySelectorAll(".btn")].filter((b) => b.offsetParent !== null);
  const boxes = btns.map((b) => b.getBoundingClientRect());

  // One line means every button shares a top edge. A wrapped row has one
  // sitting a whole button-height lower.
  const tops = boxes.map((b) => Math.round(b.top));
  ok(`${what} (${w}px): the dock stays on one line`, Math.max(...tops) - Math.min(...tops) < 4);
  ok(`${what} (${w}px): no button hangs off the edge`,
     boxes.every((b) => b.left >= -1 && b.right <= w + 1));
  ok(`${what} (${w}px): the page does not scroll sideways`,
     d.documentElement.scrollWidth <= w + 1);

  // Save is on the picture. This is the check that matters: the picture, not
  // the figure that holds it.
  const img = d.getElementById("result").getBoundingClientRect();
  const save = d.getElementById("save").getBoundingClientRect();
  ok(`${what} (${w}px): Save sits on the picture, not beside it`,
     save.left >= img.left - 1 && save.right <= img.right + 1 &&
     save.top >= img.top - 1 && save.bottom <= img.bottom + 1);
  ok(`${what} (${w}px): Save is big enough to hit`, save.height >= 40 && save.width >= 40);

  lines.push(`${String(w).padStart(4)}px  dock ${btns.length} over by ` +
    `${Math.round(d.documentElement.scrollWidth - w)}px | ` +
    btns.map((b, i) => `${(b.textContent.trim() || b.getAttribute("aria-label").split(" ")[0])}=${Math.round(boxes[i].width)}`).join(" ") +
    ` | picture ${Math.round(img.width)}x${Math.round(img.height)}, Save inset ` +
    `${Math.round(img.right - save.right)}/${Math.round(save.top - img.top)}`);
}

// An icon with no name is a button nobody can describe. The shape is the only
// label a sighted customer gets, and no label at all for anyone else.
{
  const d = await openAt(390, false);
  for (const id of ["compare", "save", "restart"]) {
    const b = d.getElementById(id);
    const named = (b.getAttribute("aria-label") ?? "").trim().length > 3 ||
                  (b.textContent ?? "").trim().length > 3;
    ok(`#${id} has a name a screen reader can read`, named);
  }
  ok("Try another keeps its words", d.getElementById("another").textContent.trim() === "Try another");
  ok("Done is the one red control",
     frame.contentWindow.getComputedStyle(d.getElementById("restart")).color !==
     frame.contentWindow.getComputedStyle(d.getElementById("compare")).color);
}

// On the kiosk the file would land on the shop's own machine, where no
// customer can reach it, so the button should not be offered at all.
{
  const d = await openAt(1080, true);
  const save = d.getElementById("save");
  ok("the kiosk does not offer Save", save.offsetParent === null);
  lines.push(`kiosk   data-kiosk=${d.body.dataset.kiosk ?? "(unset)"}, ` +
             `Save ${save.offsetParent === null ? "hidden" : "VISIBLE"}`);
}

// Layout says nothing about whether the button saves anything. Catch the
// anchor the handler builds and read the filename and the href off it: a
// blob: href is what makes the saved file same-origin, which is the whole
// reason the picture is fetched rather than linked.
{
  const d = await openAt(390, false);
  const w = frame.contentWindow;
  let grabbed = null;
  const real = w.HTMLAnchorElement.prototype.click;
  w.HTMLAnchorElement.prototype.click = function () {
    if (this.download) grabbed = { name: this.download, href: this.href };
  };
  d.getElementById("save").click();
  for (let i = 0; i < 100 && !grabbed; i++) await sleep(50);
  w.HTMLAnchorElement.prototype.click = real;

  ok("pressing Save hands over a file", Boolean(grabbed));
  ok("it is served from a blob, not the original link",
     Boolean(grabbed?.href.startsWith("blob:")));
  ok("the filename says what it is and keeps the real type",
     /^tryon-[a-z0-9-]*-\d{8}\d{4}\.png$/.test(grabbed?.name ?? ""));
  ok("and the icon turns into a tick", d.getElementById("save").classList.contains("saved"));
  lines.push(`save    ${grabbed ? `${grabbed.name}  <- ${grabbed.href.slice(0, 12)}...` : "NOTHING HANDED OVER"}`);
}

const bad = checks.filter(([, p]) => !p);
document.getElementById("log").innerHTML =
  lines.join("\n") + "\n\n" +
  checks.map(([n, p]) => `<span style="color:${p ? "#2a7" : "#c44"}">${p ? "PASS" : "FAIL"}  ${n}</span>`).join("\n");
document.title = bad.length ? `dock-FAIL-${bad.length}` : "dock-PASS";
history.replaceState(null, "", "?r=" + encodeURIComponent(checks.map(([n, p]) => (p ? "+" : "-") + n).join("~")) +
  "&m=" + encodeURIComponent(lines.join("~")));
</script>
</body>
</html>
