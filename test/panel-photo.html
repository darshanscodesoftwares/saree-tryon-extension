<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>panel-start</title>
<!--
  Drives the real src/panel.js in an ordinary page, with chrome.* and the
  camera stubbed, to check the two ways a customer's photograph gets in: the
  camera and an uploaded file. It asserts on the pixels that came out and on
  which buttons are offered, not on what the code says it did.

  Serve this folder over http and open test/panel-photo.html.
-->
</head>
<body>

<script>
// ---- the extension's surroundings, faked -------------------------------
const STORE = {};
window.chrome = {
  runtime: { getURL: (p) => "../" + p },
  storage: { local: {
    get: async (keys) => Object.fromEntries(Object.entries(STORE).filter(([k]) => keys.includes(k))),
    set: async (o) => Object.assign(STORE, o),
  } },
  tabs: {
    query: async () => [{ id: 1, url: "https://gemini.google.com/app" }],
    onActivated: { addListener() {} },
    onUpdated: { addListener() {} },
  },
  permissions: { contains: async () => true, request: async () => true },
  scripting: { executeScript: async () => [{ result: { ok: true, notes: [] } }] },
};

// A camera that shows one known picture, so a captured frame can be compared
// against the file that an upload puts through the same code.
const SRC_W = 1400, SRC_H = 2100;
const source = document.createElement("canvas");
source.width = SRC_W; source.height = SRC_H;
// Repainted on a timer rather than painted once: a canvas that never changes
// hands its captureStream no frames, and a <video> fed no frames never plays.
function paintSource() {
  const x = source.getContext("2d");
  x.fillStyle = "rgb(220,40,40)"; x.fillRect(0, 0, SRC_W / 2, SRC_H);        // left  = red
  x.fillStyle = "rgb(40,40,220)"; x.fillRect(SRC_W / 2, 0, SRC_W / 2, SRC_H); // right = blue
}
paintSource();
setInterval(paintSource, 40);

let liveTracks = [];
Object.defineProperty(navigator, "mediaDevices", {
  configurable: true,
  value: {
    getUserMedia: async () => {
      const s = source.captureStream(30);
      liveTracks = s.getTracks();
      return s;
    },
    enumerateDevices: async () => [{ kind: "videoinput", deviceId: "fake", label: "Fake camera" }],
  },
});
</script>

<!-- the panel's own markup, verbatim, so the test breaks if the two drift -->
<div id="markup"></div>
<pre id="log" style="font:12px/1.6 ui-monospace,Menlo,monospace"></pre>

<script>
// A failure inside the module must land somewhere the DOM dump can see it.
const fatal = (e) => {
  const m = String(e?.stack || e?.message || e);
  document.getElementById("log").textContent = "FATAL  " + m;
  document.title = "panel-FATAL";
  // Into the URL too, so a headless run can read it through the debugging port.
  try { history.replaceState(null, "", "?fatal=" + encodeURIComponent(m.slice(0, 1200))); } catch {}
};
addEventListener("error", (e) => fatal(e.error || e.message));
addEventListener("unhandledrejection", (e) => fatal(e.reason));
</script>

<script type="module">
try {
const panelHtml = await (await fetch("../src/panel.html")).text();
const doc = new DOMParser().parseFromString(panelHtml, "text/html");
document.getElementById("markup").append(...doc.body.children);
document.head.insertAdjacentHTML("beforeend", '<link rel="stylesheet" href="../src/panel.css">');
await import("../src/panel.js");

const $ = (id) => document.getElementById(id);
const shown = (id) => !$(id).classList.contains("hidden");
const until = async (fn, ms = 3000) => {
  const stop = Date.now() + ms;
  while (Date.now() < stop) { if (fn()) return true; await new Promise((r) => setTimeout(r, 25)); }
  return false;
};
const shot = () => document.querySelector(".shot");

// What actually came out, read back off the <img> the panel displays.
async function result() {
  const img = new Image();
  img.src = $("still").src;
  await img.decode();
  const c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext("2d").drawImage(img, 0, 0);
  const px = (fx) => [...c.getContext("2d").getImageData(Math.round(c.width * fx), c.height / 2, 1, 1).data];
  const red = (p) => p[0] > 120 && p[2] < 120;
  return { w: c.width, h: c.height, leftIsRed: red(px(0.2)), leftIsBlue: !red(px(0.2)) };
}

const fileOf = async (canvas, name = "customer.jpg", type = "image/jpeg") => {
  const blob = await new Promise((r) => canvas.toBlob(r, type, 0.92));
  return new File([blob], name, { type });
};
async function putFile(file) {
  const dt = new DataTransfer();
  dt.items.add(file);
  $("upload").files = dt.files;
  $("upload").dispatchEvent(new Event("change", { bubbles: true }));
}

const checks = [];
const ok = (name, pass) => checks.push([name, pass]);

await until(() => $("prompt").value.length > 0);

// ---- 1. nothing yet: both ways in are on offer -------------------------
ok("starts with camera and upload both offered", shown("start") && shown("uploadlabel"));
ok("starts with no capture or undo button", !shown("capture") && !shown("retake"));
ok("send is disabled with no photograph", $("send").disabled);

// ---- 2. upload, camera never touched -----------------------------------
await putFile(await fileOf(source));
ok("an uploaded file becomes the photograph", await until(() => shot().classList.contains("has-still")));
let r = await result();
ok("upload is downscaled to 1024 on the long side", r.h === 1024 && r.w === Math.round(1400 * 1024 / 2100));
ok("upload is NOT mirrored", r.leftIsRed);
ok("upload offers Clear, not Retake", shown("retake") && $("retake").textContent === "Clear");
ok("upload hides the upload button while showing", !shown("uploadlabel"));

// ---- 3. clearing an upload goes back to the empty box ------------------
$("retake").click();
ok("Clear returns to the empty box", !shot().classList.contains("has-still"));
ok("Clear re-offers the camera, not Capture", shown("start") && !shown("capture"));
ok("Clear re-offers upload", shown("uploadlabel"));

// ---- 4. the camera path still works, and still mirrors -----------------
$("start").click();
ok("camera on shows Capture", await until(() => shown("capture")));
ok("camera on still offers upload as an alternative", shown("uploadlabel"));
await until(() => $("video").videoWidth > 0);
$("capture").click();
ok("capture produces a photograph", await until(() => shot().classList.contains("has-still")));
r = await result();
ok("camera capture IS mirrored", r.leftIsBlue);
ok("camera capture offers Retake", $("retake").textContent === "Retake");

// ---- 5. retake returns to the live preview, not the empty box ----------
$("retake").click();
ok("Retake returns to the live preview", shown("capture") && !shown("start"));

// ---- 6. uploading while the camera runs releases the camera ------------
await putFile(await fileOf(source));
ok("upload over a live camera takes", await until(() => shot().classList.contains("has-still")));
ok("upload over a live camera stops the camera", liveTracks.every((t) => t.readyState === "ended"));
r = await result();
ok("that upload is not mirrored either", r.leftIsRed);
$("retake").click();
ok("clearing it returns to the empty box, camera off", shown("start") && !shown("capture"));

// ---- 7. a file that is not an image is refused, not crashed ------------
await putFile(new File(["not a picture"], "notes.txt", { type: "text/plain" }));
ok("a non-image is refused with a message", await until(() => $("status").textContent.includes("could not be read")));
ok("a non-image leaves no photograph behind", !shot().classList.contains("has-still"));
ok("a non-image leaves send disabled", $("send").disabled);

const bad = checks.filter(([, p]) => !p);
$("log").innerHTML = checks.map(([n, p]) =>
  `<span style="color:${p ? "#2a7" : "#c44"}">${p ? "PASS" : "FAIL"}  ${n}</span>`).join("\n");
document.title = bad.length ? `panel-FAIL-${bad.length}` : "panel-PASS";
// Also hung off the URL, so a headless run can read the whole result through
// the debugging port without needing a driver library.
history.replaceState(null, "", "?r=" + encodeURIComponent(
  checks.map(([n, p]) => (p ? "+" : "-") + n).join("~")));
} catch (e) { fatal(e); }
</script>
</body>
</html>
