<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>shelf-start</title>
<!--
  Drives the real kiosk page in an iframe, against the real server, to check
  what a customer is actually offered: that a garment the side panel added
  reaches the screen at all, and that the kinds are tabs so somebody looking
  for a shirt is not scrolling through sarees.

  Same origin, so the iframe's DOM can be read. Needs `npm start`.
  Run in REAL time: it waits on images loading, which is not a timer.
-->
</head>
<body>
<iframe id="kiosk" src="about:blank" style="width:460px;height:700px;border:1px solid #333"></iframe>
<pre id="log" style="font:12px/1.6 ui-monospace,Menlo,monospace"></pre>
<script type="module">
const checks = [];
const ok = (n, p, detail = "") => checks.push([n, p, detail]);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const api = (p) => new URL(p, location.href).href;
const PNG = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==";

const publish = (garments) =>
  fetch(api("../api/garments"), {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ garments }),
  });

const frame = document.getElementById("kiosk");
async function openKiosk() {
  await new Promise((done) => {
    frame.onload = done;
    frame.src = api("../webapp/") + "?t=" + checks.length;
  });
  const d = frame.contentDocument;
  for (let i = 0; i < 100; i++) {
    if (d.querySelectorAll(".tile").length) break;
    await sleep(100);
  }
  return d;
}
// The first text node only: .name also carries a .sub with the kind in it,
// and "Maroon shirt, black trousersFormals, men's" is not a garment's name.
const names = (d) => [...d.querySelectorAll(".tile .name")]
  .map((c) => (c.firstChild?.textContent ?? "").trim());
// Kinds are tabs now, not stacked headings: the page is the same height with
// three kinds as with one, and nobody scrolls past the sarees to find a shirt.
const tabs = (d, selected = false) =>
  selected
    ? (d.querySelector('.tab[aria-selected="true"]')?.textContent ?? "")
    : [...d.querySelectorAll(".tab")].map((t) => t.textContent.trim());

try {
  // What ships, read from the library rather than counted by hand - the shop
  // adds garments to it and a hard-coded 3 turns this into a test of how
  // recently somebody edited this file.
  const { GARMENTS } = await import("../src/library.js");
  const BUNDLED = GARMENTS.length;
  const BUNDLED_KINDS = new Set(GARMENTS.map((g) => g.kind ?? "saree")).size;

  // 1. nothing added in the panel: everything that ships is offered.
  await publish([]);
  let d = await openKiosk();
  ok("the bundled garments are offered", names(d).length >= 1);
  // Kinds plus All, which exists so a customer who does not think in our
  // categories does not have to.
  ok("tabs appear only when there is a choice to make",
     BUNDLED_KINDS > 1 ? tabs(d).length === BUNDLED_KINDS + 1 : tabs(d).length === 0,
     `${BUNDLED_KINDS} kinds, ${tabs(d).length} tabs`);
  ok("and All is the one that opens", /^all/i.test(tabs(d, true)), tabs(d, true));

  // 2. the panel adds two formals; both must reach the screen, under the tab
  //    for their own kind.
  await publish([
    { id: "u1", kind: "formals-men", name: "a shirt and trousers", src: PNG },
    { id: "u2", kind: "formals-women", name: "a trouser suit", src: PNG },
  ]);
  d = await openKiosk();
  ok("the bundled ones are still there", names(d).length >= 1);
  ok("a tab exists for each kind on the shelf, plus All",
     tabs(d).length === 4, tabs(d).join(" / "));
  ok("the tabs name the kinds",
     tabs(d).some((x) => /saree/i.test(x)) &&
     tabs(d).some((x) => /men/i.test(x)) &&
     tabs(d).some((x) => /women/i.test(x)));

  // THE POINT OF TABS. Somebody looking for a shirt should not be scrolling
  // past sarees, so only the chosen kind is on screen - this is what keeps the
  // shelf the same height however much the shop stocks.
  const racks = [...d.querySelectorAll(".rack")];
  ok("only one rack is on screen at a time", racks.length === 1, `${racks.length} racks`);
  // Opening on All, everything is reachable without choosing a category first.
  ok("All shows every garment",
     names(d).includes("a shirt and trousers") && names(d).includes("a trouser suit"),
     names(d).join(", "));

  // Switching to menswear must show the menswear and nothing else.
  // By id, not by text: /men's/ also matches "women's", which quietly clicked
  // the wrong tab and then blamed the code for showing the wrong garments.
  const mens = d.getElementById("tab-formals-men");
  mens.click();
  await sleep(150);
  // The menswear rack holds the one the panel added AND whatever menswear
  // ships - counting to one here only worked while the library had none.
  const onRack = names(d);
  ok("choosing a tab swaps the rack to that kind",
     onRack.includes("a shirt and trousers") && !onRack.includes("a trouser suit") &&
     !onRack.some((n) => /saree|silk|bridal/i.test(n)),
     "rack: " + onRack.join(", "));
  ok("the tab's count matches what is on the rack",
     mens.querySelector(".tab-n")?.textContent === String(onRack.length),
     `tab says ${mens.querySelector(".tab-n")?.textContent}, rack holds ${onRack.length}`);
  ok("exactly one tab is selected",
     [...d.querySelectorAll(".tab")].filter((t) => t.getAttribute("aria-selected") === "true").length === 1);

  // Back to the sarees for the pressed-state checks below.
  [...d.querySelectorAll(".tab")].find((t) => /saree/i.test(t.textContent)).click();
  await sleep(150);

  const tiles = [...d.querySelectorAll(".tile")];
  ok("every tile is a button",      tiles.every((t) => t.tagName === "BUTTON"));
  ok("every tile reports pressed",  tiles.every((t) => t.hasAttribute("aria-pressed")));
  ok("none is pressed to start",    tiles.every((t) => t.getAttribute("aria-pressed") === "false"));
  tiles[0].click();
  await sleep(300);
  const after2 = [...d.querySelectorAll(".tile")];
  ok("choosing one marks it pressed", after2.some((t) => t.getAttribute("aria-pressed") === "true"));
  ok("and only one",                  after2.filter((t) => t.getAttribute("aria-pressed") === "true").length === 1);

  await publish([]);   // leave it as it was found
} catch (e) {
  ok("the test itself ran: " + (e?.message ?? e), false);
}

const bad = checks.filter(([, p]) => !p);
document.getElementById("log").innerHTML =
  checks.map(([n, p]) => `<span style="color:${p ? "#2a7" : "#c44"}">${p ? "PASS" : "FAIL"}  ${n}</span>`).join("\n");
document.title = bad.length ? `shelf-FAIL-${bad.length}` : "shelf-PASS";
history.replaceState(null, "", "?r=" + encodeURIComponent(checks.map(([n, p, d]) => (p ? "+" : "-") + n + (p || !d ? "" : " >> " + d)).join("~")));
</script>
</body>
</html>
