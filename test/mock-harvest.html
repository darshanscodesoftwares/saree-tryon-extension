<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>harvest-start</title>
<!--
  A stand-in for a generator's page AFTER sending, so src/harvest.js can be
  tested on the thing it actually has to do: tell a generated picture apart
  from the two we just uploaded.

  This is the half that had never been run for real, and the first time it was,
  ChatGPT produced a picture and harvest.js reported that nothing arrived. So
  the cases here are the ones that failed or nearly did:

    ?where=assistant  the picture inside the site's own assistant marker
    ?where=main       outside that marker, so a fallback selector must find it
    ?where=none       no picture at all; the census must say what WAS there
    ?echo=late        our two uploads re-rendered AFTER watching starts, which
                      must not be mistaken for the answer
    ?srcset=1         the page renders a small copy and names a bigger one in
                      srcset, which is what must actually be taken
    ?lookalike=1      the answer is a DIFFERENT person in the SAME staging as
                      the garment we uploaded - one figure, centred, full
                      length, plain pale ground. That is every picture in this
                      app, and a coarse hash calls them identical: it is why
                      build 5 began refusing the real answer and nothing came
                      back at all. It must be taken.
    ?mine=reencoded   the page offers our own upload RE-ENCODED: same picture,
                      different bytes. Comparing bytes cannot see it, and this
                      is the one that shipped broken - it came back as the
                      customer's own photograph whenever the generator's tab
                      happened to be in the foreground.
    ?mine=1           the page offers one of OUR OWN uploads in the answer's
                      own place, at a new URL, long after the quiet period.
                      Every positional rule says take it; only comparing the
                      bytes says do not. This is the last line of defence.
    ?rehost=1         the page re-hosts OUR uploads after watching began, so
                      the customer's own photograph gets a brand new URL and
                      looks like a fresh image. It must never be returned as
                      the answer - this is the one that shipped broken, and it
                      showed the customer a picture of herself.
    ?rehost=noanswer  the same, with no answer ever arriving: it must give up
                      rather than hand back the re-hosted photograph
    ?recover=1        the picture is ALREADY on the page when watching starts,
                      because the watcher died and was put back. There is no
                      "before" to compare against, so it must take what is
                      there - this is the path that rescues a job whose tab
                      reloaded mid-generation
-->
<style>body{font:13px/1.6 ui-monospace,Menlo,monospace;background:#14181a;color:#e8edef;padding:16px}
img{max-width:90px}.pass{color:#7fb98a}.fail{color:#c4564a}#log{white-space:pre-wrap}</style>
</head>
<body>
<div id="page"></div>
<pre id="log"></pre>
<script>
// A throw inside the async fixture is otherwise invisible: the title stays at
// "start" and there is nothing to read.
const fatal = (e) => {
  document.getElementById("log").textContent = "FATAL  " + (e?.stack || e?.message || e);
  document.title = "harvest-FATAL";
  try { history.replaceState(null, "", "?fatal=" + encodeURIComponent(String(e?.message || e).slice(0, 300))); } catch {}
};
addEventListener("error", (e) => fatal(e.error || e.message));
addEventListener("unhandledrejection", (e) => fatal(e.reason));
</script>

<script>
// Pictures of a known size, so "big enough" and "which one" are decidable.
// Pictures with STRUCTURE, not flat fills. A solid rectangle has no signature
// to speak of - every flat fill looks like every other - so a fixture made of
// them cannot test whether two pictures are the same picture.
function png(w, h, colour, seed = 0) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const x = c.getContext("2d");
  x.fillStyle = colour; x.fillRect(0, 0, w, h);
  x.fillStyle = "rgba(255,255,255,.9)";
  for (let i = 0; i < 4; i++) {
    x.beginPath();
    x.arc(w * (0.2 + 0.2 * ((i + seed) % 4)), h * (0.18 + 0.2 * ((i * 3 + seed) % 4)),
          Math.min(w, h) * 0.1, 0, 7);
    x.fill();
  }
  x.fillStyle = "rgba(0,0,0,.75)";
  x.fillRect(0, h * (0.5 + 0.08 * (seed % 3)), w, h * 0.14);
  return c.toDataURL("image/jpeg", 0.92);
}
const PERSON = png(1024, 1365, "#c79a7a", 1);     // what we uploaded
const SAREE  = png(1024, 1536, "#d08a35", 2);     // what we uploaded
const RESULT = png(1024, 1536, "#2d6a4f", 3);     // what came back
const RESULT_SMALL = png(512, 768, "#2d6a4f", 3); // the copy a page may render
// The same upload at a different URL, which is what re-hosting produces.
const PERSON_REHOSTED = png(1024, 1365, "#c79a7b", 1);

// One figure, centred, full length, on a plain pale ground - the staging every
// picture in this app shares. Two of these are DIFFERENT pictures that a coarse
// hash cannot tell apart, which is the whole point of the lookalike case.
function figure(bg, skin, clothes, build) {
  const c = document.createElement("canvas");
  c.width = 1024; c.height = 1536;
  const x = c.getContext("2d");
  x.fillStyle = bg; x.fillRect(0, 0, 1024, 1536);
  const cx = 512, w = build;
  x.fillStyle = skin;                                  // head
  x.beginPath(); x.arc(cx, 300, 110, 0, 7); x.fill();
  x.fillStyle = clothes;                               // torso
  x.fillRect(cx - w, 420, w * 2, 520);
  x.fillRect(cx - w * 1.5, 430, w * 0.5, 430);         // arms
  x.fillRect(cx + w, 430, w * 0.5, 430);
  x.fillStyle = "#23242a";                             // legs
  x.fillRect(cx - w * 0.9, 940, w * 0.8, 500);
  x.fillRect(cx + w * 0.1, 940, w * 0.8, 500);
  return c.toDataURL("image/jpeg", 0.92);
}
const LOOKALIKE_GARMENT = figure("#f2f2f4", "#c79a7a", "#6b2737", 150);
const LOOKALIKE_RESULT  = figure("#e6e7ea", "#8a6b4f", "#5d2a3a", 185);

const params = new URLSearchParams(location.search);
const where = params.get("where") ?? "assistant";
const lateEcho = params.get("echo") === "late";

const page = document.getElementById("page");
const add = (html) => page.insertAdjacentHTML("beforeend", html);

// An avatar and an icon, which must never be chosen.
add(`<img src="${png(32, 32, "#888")}" alt="avatar"><img src="${png(24, 24, "#555")}" alt="icon">`);

// The user's turn, holding our two uploads. Either already present, or
// re-rendered shortly after watching begins - the case that matters.
async function userTurn() {
  const turn = document.createElement("div");
  turn.setAttribute("data-message-author-role", "user");
  for (const src of [PERSON, SAREE]) {
    const img = new Image();
    img.src = src;
    try { await img.decode(); } catch {}
    turn.appendChild(img);
  }
  page.appendChild(turn);
}

// Harness timings: seconds, not minutes.
window.__sareeHarvestConfig = { settleFirst: 400, stableFor: 300, giveUpAfter: 7000, quietFor: 1200 };

// Capture what harvest.js reports instead of messaging a service worker.
let reported = null;
window.chrome = { runtime: { sendMessage: (m) => { reported = m; } } };
</script>

<script>
// Awaited before harvest.js runs, so the "already on the page" snapshot really
// does contain our two uploads in the early case.
window.__fixtureReady = (async () => { if (!lateEcho) await userTurn(); })();
</script>

<script src="../src/harvest.js"></script>

<script>
(async () => {
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Decoded BEFORE it goes into the page. An <img> only counts once it has
  // loaded, and image decoding is not a timer - so inserting markup and hoping
  // made this test race its own fixture and fail at random.
  async function place(container, src, srcset) {
    const img = new Image();
    if (srcset) img.srcset = srcset;
    img.src = src;
    try { await img.decode(); } catch {}
    container.appendChild(img);
    return img;
  }
  // The same picture at a different address, which is exactly what re-hosting
  // produces: identical bytes, nothing else in common. A data URL cannot
  // simulate it - the URL IS the bytes - so the fixture has to make a blob.
  const reHosted = async (dataUrl) =>
    URL.createObjectURL(await (await fetch(dataUrl)).blob());

  // The same picture through another encoder: different bytes, different
  // size, same light in the same places. This is what a page does to an
  // upload, and it is invisible to a byte comparison.
  const reEncoded = async (dataUrl) => {
    const bmp = await createImageBitmap(await (await fetch(dataUrl)).blob());
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * 0.8);
    c.height = Math.round(bmp.height * 0.8);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close();
    return c.toDataURL("image/jpeg", 0.55);
  };

  const box = (html) => {
    const t = document.createElement("div");
    t.innerHTML = html;
    // Held before appending: appending MOVES it, so reading firstElementChild
    // afterwards gives null.
    const el = t.firstElementChild;
    page.appendChild(el);
    return el;
  };

  await window.__fixtureReady;

  // What the worker hands over: the two we uploaded, so they can be recognised
  // again however the page re-serves them.
  const MINE = params.get("lookalike") ? [PERSON, LOOKALIKE_GARMENT] : [PERSON, SAREE];

  if (params.get("recover")) {
    // The answer landed while nobody was watching. Put it on the page FIRST,
    // then start in recovery mode, which is what the worker does when it finds
    // the injected script gone.
    await place(box('<div data-message-author-role="assistant"></div>'), RESULT);
    window.__sareeHarvest.start("test-job", true, MINE);
  } else {
    window.__sareeHarvest.start("test-job", false, MINE);
  }

  if (lateEcho) {
    await sleep(120);
    await userTurn();
  }

  if (params.get("rehost")) {
    // Well after the snapshot, so these URLs are genuinely new to the watcher.
    await sleep(700);
    const mine = page.querySelectorAll('[data-message-author-role="user"] img');
    const swapped = new Image();
    swapped.src = PERSON_REHOSTED;
    try { await swapped.decode(); } catch {}
    mine[0].src = PERSON_REHOSTED;
  }

  // The answer arrives well after watching began, as a real one does.
  if (!params.get("recover")) await sleep(900);
  if (params.get("lookalike")) {
    // The staging is identical; the picture is not.
    await sleep(1500);
    await place(box('<div data-message-author-role="assistant"></div>'), LOOKALIKE_RESULT);
  } else if (params.get("mine")) {
    // Timed so the byte test is the thing that has to work. Placed AFTER the
    // quiet period, left alone long enough to stabilise, and the only
    // candidate on the page - so every rule about where and when it is says
    // "this is the answer", and only its bytes say otherwise.
    await sleep(1500);
    await place(
      box('<div data-message-author-role="assistant"></div>'),
      params.get("mine") === "reencoded" ? await reEncoded(PERSON) : await reHosted(PERSON)
    );
    await sleep(1200);
    // Only then does the real one arrive.
    await place(box('<div data-message-author-role="assistant"></div>'), RESULT);
  } else if (params.get("rehost") === "noanswer") {
    // nothing ever arrives: the point is that it must NOT take ours
  } else if (params.get("recover")) {
    // already placed above
  } else if (params.get("srcset")) {
    // Rendered small, with the full size named in srcset - the common case.
    await place(box('<div data-message-author-role="assistant"></div>'),
                RESULT_SMALL, `${RESULT_SMALL} 512w, ${RESULT} 1024w`);
  } else if (where === "assistant") {
    await place(box('<div data-message-author-role="assistant"></div>'), RESULT);
  } else if (where === "main") {
    await place(box("<main><div></div></main>").querySelector("div"), RESULT);
  }

  for (let i = 0; i < 150 && !reported; i++) await sleep(100);

  const notes = (reported?.notes ?? []).join(" | ");
  // peek() is how the worker reads this script from outside, which is the
  // whole reason a job no longer hangs when the pushed message is lost.
  const seen = window.__sareeHarvest.peek();

  const checks = params.get("lookalike")
    ? [
        ["a different person in the same staging is taken", reported?.ok === true],
        ["and it is the generated one",                     reported?.url === LOOKALIKE_RESULT],
        ["it was not mistaken for ours",                    !notes.includes("one of ours")],
        ["and it reported how far apart they were",         /from the nearest of ours/.test(notes)],
      ]
    : params.get("mine")
    ? [
        ["it did not take our own upload", reported?.url !== PERSON],
        ["it took the generated one",      reported?.url === RESULT],
        ["it said why it skipped ours",    notes.includes("one of ours")],
        ...(params.get("mine") === "reencoded"
          ? [["it recognised the picture, not the bytes", notes.includes("re-encoded")]]
          : []),
      ]
    : params.get("rehost") === "noanswer"
    ? [
        ["it gave up rather than taking ours", reported?.ok === false],
        ["it did not return the customer",     reported?.url !== PERSON_REHOSTED],
        ["nor the original upload",            reported?.url !== PERSON],
      ]
    : params.get("rehost")
    ? [
        ["it found a picture",                 reported?.ok === true],
        ["it took the generated one",          reported?.url === RESULT],
        ["NOT the re-hosted customer photo",   reported?.url !== PERSON_REHOSTED],
        ["nor the saree we uploaded",          reported?.url !== SAREE],
      ]
    : params.get("recover")
    ? [
        ["it finds a picture already on the page", reported?.ok === true],
        ["and it is the right one",                reported?.url === RESULT],
        ["it says it was picked up again",         notes.includes("picked up again")],
        ["peek() reports it finished",             seen?.done === true],
        ["peek() carries the result",              seen?.payload?.url === RESULT],
      ]
    : params.get("srcset")
    ? [
        ["it found a picture",            reported?.ok === true],
        ["it took the WIDEST in srcset",  reported?.url === RESULT],
        ["not the small one rendered",    reported?.url !== RESULT_SMALL],
        ["it said it used the srcset",    (reported?.notes ?? []).join(" ").includes("srcset")],
      ]
    : where === "none"
    ? [
        ["it gave up rather than hanging",       reported?.ok === false],
        ["it said nothing arrived",              notes.includes("nothing that looked like")],
        ["the census counted the page's images", /\d+ images on the page/.test(notes)],
        ["the census listed each selector",      notes.includes("new per selector")],
      ]
    : [
        ["it found a picture",                   reported?.ok === true],
        ["it took the generated one",            reported?.url === RESULT],
        ["not the person we uploaded",           reported?.url !== PERSON],
        ["not the saree we uploaded",            reported?.url !== SAREE],
        ["it said where it found it",            /from the|from a/.test(notes)],
        ["it read the bytes back",               typeof reported?.dataUrl === "string"],
        ["peek() reports it finished",           seen?.done === true],
        ["peek() carries the same result",       seen?.payload?.url === reported?.url],
      ];

  const bad = checks.filter(([, p]) => !p);
  document.getElementById("log").innerHTML =
    `where=${where} echo=${lateEcho ? "late" : "early"}\n\n` +
    checks.map(([n, p]) => `<span class="${p ? "pass" : "fail"}">${p ? "PASS" : "FAIL"}  ${n}</span>`).join("\n") +
    `\n\nreported:\n  ` + (reported?.notes ?? ["(nothing)"]).join("\n  ");
  document.title = bad.length ? `harvest-FAIL-${bad.length}` : "harvest-PASS";
  history.replaceState(null, "", "?done=1&r=" + encodeURIComponent(checks.map(([n, p]) => (p ? "+" : "-") + n).join("~")));
})();
</script>
</body>
</html>
